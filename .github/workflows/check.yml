name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun scripts/prepare.ts
      - run: bun --bun vite build
      - run: bun run check
      - run: bun scripts/compile.ts
      - run: bun scripts/smoke.ts dist/mailrun
      - run: bun scripts/smoke-mail-reads.ts dist/mailrun
      - run: bun scripts/smoke-message-details.ts dist/mailrun
      - run: bun run smoke:source-uploads dist/mailrun
      - run: bun run smoke:source-features dist/mailrun
      - run: bun run smoke:source-record-restore dist/mailrun
      - run: sha256sum dist/mailrun > dist/mailrun.sha256
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: mailrun-linux-${{ github.sha }}
          path: |
            dist/mailrun
            dist/mailrun.sha256
          retention-days: 1
